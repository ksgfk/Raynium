plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'raynium'
}

def gameRunDir = localConfig('gameRunDir', 'run')
def rayniumSystemProps = providers.systemPropertiesPrefixedBy('raynium.').get()

def combinedAccessWidener = layout.buildDirectory.file('loom/combined.accesswidener').get().asFile
def combinedAwContent = {
    def lines = ['accessWidener v2 official']
    [file('src/client/resources/raynium.accesswidener'), file('src/harness/resources/raynium-harness.accesswidener')].each { awFile ->
        awFile.readLines('UTF-8').eachWithIndex { line, idx ->
            if (idx == 0) {
                if (line.trim() != 'accessWidener v2 official') {
                    throw new GradleException("Unexpected access widener header in ${awFile}: ${line}")
                }
            } else if (!line.trim().isEmpty()) {
                lines.add(line)
            }
        }
    }
    return lines.join('\n') + '\n'
}()
if (!combinedAccessWidener.exists() || combinedAccessWidener.getText('UTF-8') != combinedAwContent) {
    combinedAccessWidener.parentFile.mkdirs()
    combinedAccessWidener.setText(combinedAwContent, 'UTF-8')
}

sourceSets {
    harness
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = combinedAccessWidener

    mods {
        raynium {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        'raynium-harness' {
            sourceSet sourceSets.harness
        }
    }

    runs {
        client {
            client()
            configName = 'Minecraft Client (Raynium)'
            ideConfigGenerated = true
            runDir = gameRunDir
            programArg '--gameDir'
            programArg file(gameRunDir).absolutePath
            vmArg '--enable-native-access=ALL-UNNAMED'
            properties(rayniumSystemProps)
        }
        clientNative {
            inherit client
            getJvmArguments().set(client.getJvmArguments())
            configName = 'Minecraft Client (Raynium Native)'
            ideConfigGenerated = true
            runDir = gameRunDir
            programArg '--gameDir'
            programArg file(gameRunDir).absolutePath
            property 'raynium.native.dir', layout.buildDirectory.dir('native/stage/windows-x86_64/Debug').get().asFile.absolutePath
        }
        clientNativeRelease {
            inherit client
            getJvmArguments().set(client.getJvmArguments())
            configName = 'Minecraft Client (Raynium Native Release)'
            ideConfigGenerated = false
            runDir = gameRunDir
            programArg '--gameDir'
            programArg file(gameRunDir).absolutePath
            property 'raynium.native.dir', layout.buildDirectory.dir('native/stage/windows-x86_64/Release').get().asFile.absolutePath
        }
        clientReference {
            client()
            source(sourceSets.harness)
            configName = 'Minecraft Client (Vanilla Reference)'
            ideConfigGenerated = false
            runDir = gameRunDir
            programArg '--gameDir'
            programArg file(gameRunDir).absolutePath
            programArg '--graphicsBackend'
            programArg 'VULKAN'
            vmArg '--enable-native-access=ALL-UNNAMED'
            properties(rayniumSystemProps)
            property 'fabric.classPathGroups', sourceSets.harness.output.files.collect { it.absolutePath }.join(File.pathSeparator)
        }
        remove server
    }
}

tasks.matching { it.name == 'runClientReference' }.configureEach {
    def excluded = (sourceSets.main.output.files + sourceSets.client.output.files).collect { it.toPath().toAbsolutePath().normalize() } as Set
    classpath = classpath.filter { file -> !excluded.contains(file.toPath().toAbsolutePath().normalize()) }
}

configurations {
    harnessCompileClasspath.extendsFrom(clientCompileClasspath)
    harnessRuntimeClasspath.extendsFrom(clientRuntimeClasspath)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    harnessCompileOnly sourceSets.main.output
    harnessCompileOnly sourceSets.client.output
    testImplementation sourceSets.harness.output
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(ProcessResources).configureEach {
    def properties = [
        version: project.version,
        minecraft_version: project.minecraft_version,
        loader_version: project.loader_version
    ]
    inputs.properties properties
    filesMatching('fabric.mod.json') {
        expand properties
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'native' }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

apply from: 'gradle/native.gradle'

tasks.register('exportVanillaPipelines', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.raynium.tools.ExportVanillaPipelines'
    args layout.buildDirectory.file('vanilla/pipelines.json').get().asFile.absolutePath
}
