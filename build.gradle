plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'raynium'
}

def gameRunDir = providers.gradleProperty('gameRunDir').getOrElse('run')

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file('src/client/resources/raynium.accesswidener')

    mods {
        raynium {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            client()
            configName = 'Minecraft Client (Raynium)'
            ideConfigGenerated = true
            runDir = gameRunDir
            programArg '--gameDir'
            programArg file(gameRunDir).absolutePath
            if (providers.gradleProperty('quickPlayWorld').isPresent()) {
                programArg '--quickPlaySingleplayer'
                programArg providers.gradleProperty('quickPlayWorld').get()
            }
            vmArg '--enable-native-access=ALL-UNNAMED'
            if (providers.gradleProperty('jfrFile').isPresent()) {
                vmArg '-XX:StartFlightRecording=name=Raynium,settings=profile,disk=true,dumponexit=true,maxsize=1g,filename=' +
                    file(providers.gradleProperty('jfrFile').get()).absolutePath
            }
            property 'raynium.rhi.backend', providers.gradleProperty('rhiBackend').getOrElse('d3d12')
            property 'raynium.rhi.validation', providers.gradleProperty('rhiValidation').getOrElse('false')
            property 'raynium.terrain.submission', providers.gradleProperty('terrainSubmission').getOrElse('auto')
        }
        clientNative {
            inherit client
            getJvmArguments().set(client.getJvmArguments())
            runDir = gameRunDir
            programArg '--gameDir'
            programArg file(gameRunDir).absolutePath
            if (providers.gradleProperty('quickPlayWorld').isPresent()) {
                programArg '--quickPlaySingleplayer'
                programArg providers.gradleProperty('quickPlayWorld').get()
            }
            if (providers.gradleProperty('benchmarkConfig').isPresent()) {
                if (!providers.gradleProperty('benchmarkRunDir').isPresent()) {
                    throw new GradleException('benchmarkConfig requires benchmarkRunDir')
                }
                runDir = file(providers.gradleProperty('benchmarkRunDir').get()).absolutePath
                property 'raynium.benchmark.config', file(providers.gradleProperty('benchmarkConfig').get()).absolutePath
                programArg '--gameDir'
                programArg file(providers.gradleProperty('benchmarkRunDir').get()).absolutePath
                programArg '--quickPlaySingleplayer'
                programArg 'benchmark'
            }
            configName = 'Minecraft Client (Raynium Native)'
            ideConfigGenerated = true
            property 'raynium.native.dir', layout.buildDirectory.dir(
                "native/stage/windows-x86_64/${providers.gradleProperty('nativeConfig').getOrElse('Debug')}"
            ).get().asFile.absolutePath
        }
        remove server
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def properties = [
        version: project.version,
        minecraft_version: project.minecraft_version,
        loader_version: project.loader_version
    ]
    inputs.properties properties
    filesMatching('fabric.mod.json') {
        expand properties
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'native' }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

apply from: 'gradle/native.gradle'
